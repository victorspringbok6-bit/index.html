<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredictZ - Football Predictions & Betting Engine</title>
    <style>
        :root {
            --bg-main: #f4f6f9;
            --header-bg: #1a2530;
            --card-bg: #ffffff;
            --accent-green: #27ae60;
            --accent-blue: #2980b9;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e2e8f0;
            --odds-bg: #edf2f7;
            --odds-hover: #e2e8f0;
            --odds-active: #27ae60;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); line-height: 1.5; padding-bottom: 60px; }

        header { background: var(--header-bg); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
        header span { color: var(--accent-green); }

        nav { background: #2c3e50; display: flex; overflow-x: auto; white-space: nowrap; border-bottom: 2px solid var(--accent-green); }
        nav button { background: none; border: none; color: #ecf0f1; padding: 12px 18px; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
        nav button:hover, nav button.active { background: var(--accent-green); color: #fff; }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 320px; gap: 20px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .filter-panel { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .filter-group { margin-bottom: 12px; }
        .filter-group label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-filter { background: var(--odds-bg); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .btn-filter.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); text-align: center; }
        .stat-card .val { font-size: 1.25rem; font-weight: 700; color: var(--accent-blue); }
        .stat-card .lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .match-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr 200px; gap: 15px; align-items: center; }
        @media (max-width: 600px) { .match-card { grid-template-columns: 1fr; } }

        .match-meta { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
        .teams { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
        .form-badges { display: flex; gap: 4px; font-size: 0.7rem; margin-top: 4px; }
        .badge { padding: 2px 6px; border-radius: 3px; font-weight: 700; color: #fff; }
        .badge-w { background: var(--accent-green); }
        .badge-d { background: #f39c12; }
        .badge-l { background: #e74c3c; }

        .odds-box { display: flex; gap: 6px; }
        .odds-btn { flex: 1; background: var(--odds-bg); border: 1px solid var(--border-color); padding: 8px; border-radius: 4px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .odds-btn:hover { background: var(--odds-hover); }
        .odds-btn.active { background: var(--odds-active); color: #fff; border-color: var(--odds-active); }
        .odds-lbl { display: block; font-size: 0.7rem; color: var(--text-muted); }
        .odds-btn.active .odds-lbl { color: #e8f8f0; }
        .odds-val { font-weight: 700; font-size: 0.9rem; }

        .betslip { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; position: sticky; top: 20px; }
        .betslip h3 { font-size: 1.1rem; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; }
        .betslip-item { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 4px; padding: 8px; margin-bottom: 8px; position: relative; font-size: 0.85rem; }
        .betslip-item .remove-btn { position: absolute; right: 8px; top: 8px; color: #e74c3c; cursor: pointer; font-weight: 700; border: none; background: none; }
        .betslip-summary { margin-top: 15px; border-top: 2px solid var(--border-color); padding-top: 10px; font-size: 0.9rem; }
        .betslip-summary div { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .stake-input { width: 80px; padding: 4px; text-align: right; font-weight: 700; }

        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; font-size: 0.85rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: #f8fafc; font-weight: 700; color: var(--text-muted); }
    </style>
</head>

                    <div>
                        <div class="match-meta">${m.date} | ${m.competition}</div>
                        <div class="teams">${m.homeTeam} vs ${m.awayTeam}</div>
                        <div style="font-size: 0.8rem; color: var(--accent-blue); font-weight: 600;">
                            Prediction: ${m.prediction.pick} (Correct Score: ${m.prediction.correctScore})
                        </div>
                        <div class="form-badges">
                            <span>Form: </span>
                            ${m.homeForm.map(f => `<span class="badge badge-${f.toLowerCase()}">${f}</span>`).join('')}
                            <span style="margin: 0 4px;">vs</span>
                            ${m.awayForm.map(f => `<span class="badge badge-${f.toLowerCase()}">${f}</span>`).join('')}
                        </div>
                    </div>
                    <div class="odds-box">
                        <div class="odds-btn ${isSelected('1') ? 'active' : ''}" onclick="toggleOdds(${m.id}, '1', ${m.odds['1']})">
                            <span class="odds-lbl">1</span>
                            <span class="odds-val">${m.odds['1'].toFixed(2)}</span>
                        </div>
                        <div class="odds-btn ${isSelected('X') ? 'active' : ''}" onclick="toggleOdds(${m.id}, 'X', ${m.odds['X']})">
                            <span class="odds-lbl">X</span>
                            <span class="odds-val">${m.odds['X'].toFixed(2)}</span>
                        </div>
                        <div class="odds-btn ${isSelected('2') ? 'active' : ''}" onclick="toggleOdds(${m.id}, '2', ${m.odds['2']})">
                            <span class="odds-lbl">2</span>
                            <span class="odds-val">${m.odds['2'].toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function setDate(d) { appState.selectedDate = d; renderView(); }
        function setCompetition(c) { appState.selectedCompetition = c; renderView(); }
        function setMarket(m) { appState.selectedMarket = m; renderView(); }

        function toggleOdds(matchId, pick, odds) {
            const match = matchesDatabase.find(m => m.id === matchId);
            const existingIndex = appState.betSlip.findIndex(item => item.matchId === matchId);

            if (existingIndex > -1) {
                if (appState.betSlip[existingIndex].pick === pick) {
                    appState.betSlip.splice(existingIndex, 1);
                } else {
                    appState.betSlip[existingIndex].pick = pick;
                    appState.betSlip[existingIndex].odds = odds;
                }
            } else {
                appState.betSlip.push({
                    matchId: match.id,
                    matchName: `${match.homeTeam} vs ${match.awayTeam}`,
                    pick: pick,
                    odds: odds
                });
            }
            updateBetSlipUI();
            renderView();
        }

        function bindBetSlipEvents() {
            document.getElementById('stakeInput').addEventListener('input', (e) => {
                appState.stake = parseFloat(e.target.value) || 0;
                updateBetSlipUI();
            });
        }

        function updateBetSlipUI() {
            const container = document.getElementById('slipItems');
            document.getElementById('slipCount').innerText = appState.betSlip.length;

            if (appState.betSlip.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">Select odds to build an accumulator.</p>';
                document.getElementById('totalOdds').innerText = '0.00';
                document.getElementById('estReturn').innerText = '€0.00';
                return;
            }

            let totalOdds = 1;
            container.innerHTML = appState.betSlip.map((item, idx) => {
                totalOdds *= item.odds;
                return `
                    <div class="betslip-item">
                        <button class="remove-btn" onclick="removeSelection(${idx})">×</button>
                        <strong>${item.matchName}</strong><br>
                        <span>Pick: <strong>${item.pick}</strong> @ ${item.odds.toFixed(2)}</span>
                    </div>
                `;
            }).join('');

            document.getElementById('totalOdds').innerText = totalOdds.toFixed(2);
            document.getElementById('estReturn').innerText = '€' + (totalOdds * appState.stake).toFixed(2);
        }

        function removeSelection(index) {
            appState.betSlip.splice(index, 1);
            updateBetSlipUI();
            renderView();
        }

        function computeStats(matches) {
            if (!matches.length) return { homeWinPct: 0, bttsPct: 0, over25Pct: 0 };
            const homeWins = matches.filter(m => m.prediction.pick === '1').length;
            const btts = matches.filter(m => m.btts).length;
            const over25 = matches.filter(m => m.over25).length;
            return {
                homeWinPct: Math.round((homeWins / matches.length) * 100),
                bttsPct: Math.round((btts / matches.length) * 100),
                over25Pct: Math.round((over25 / matches.length) * 100)
            };
        }

        function renderResultsView(container) {
            const results = matchesDatabase.filter(m => m.status === 'FINISHED');
            container.innerHTML = `
                <h2 style="margin-bottom: 15px;">Settled Match Results</h2>
                <table>
                    <thead>
                        <tr><th>Date</th><th>Competition</th><th>Match</th><th>Result</th><th>Predicted</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                        ${results.map(r => {
                            const actualPick = r.result.home > r.result.away ? '1' : (r.result.home === r.result.away ? 'X' : '2');
                            const win = actualPick === r.prediction.pick;
                            return `
                                <tr>
                                    <td>${r.date}</td>
                                    <td>${r.competition}</td>
                                    <td>${r.homeTeam} vs ${r.awayTeam}</td>
                                    <td><strong>${r.result.home} - ${r.result.away}</strong></td>
                                    <td>${r.prediction.pick}</td>
                                    <td><span class="badge ${win ? 'badge-w' : 'badge-l'}">${win ? 'WON' : 'LOST'}</span></td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderTablesView(container) {
            const finished = matchesDatabase.filter(m => m.status === 'FINISHED');
            const tableMap = {};

            finished.forEach(m => {
                [m.homeTeam, m.awayTeam].forEach(t => {
                    if (!tableMap[t]) tableMap[t] = { team: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
                });

                const h = tableMap[m.homeTeam];
                const a = tableMap[m.awayTeam];
                h.p++; a.p++;
                h.gf += m.result.home; h.ga += m.result.away;
                a.gf += m.result.away; a.ga += m.result.home;

                if (m.result.home > m.result.away) { h.w++; h.pts += 3; a.l++; }
                else if (m.result.home === m.result.away) { h.d++; h.pts += 1; a.d++; a.pts += 1; }
                else { a.w++; a.pts += 3; h.l++; }
            });

            const standings = Object.values(tableMap).sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga));

            container.innerHTML = `
                <h2 style="margin-bottom: 15px;">Calculated Standings (From Completed Fixtures)</h2>
                <table>
                    <thead>
                        <tr><th>Pos</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr>
                    </thead>
                    <tbody>
                        ${standings.map((t, idx) => `
                            <tr>
                                <td>${idx + 1}</td>
                                <td><strong>${t.team}</strong></td>
                                <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
                                <td>${t.gf}</td><td>${t.ga}</td><td>${t.gf - t.ga}</td>
                                <td><strong>${t.pts}</strong></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderStatisticsView(container) {
            const total = matchesDatabase.length;
            const btts = matchesDatabase.filter(m => m.btts).length;
            const over25 = matchesDatabase.filter(m => m.over25).length;
            const homeWins = matchesDatabase.filter(m => m.prediction.pick === '1').length;
            const draws = matchesDatabase.filter(m => m.prediction.pick === 'X').length;
            const awayWins = matchesDatabase.filter(m => m.prediction.pick === '2').length;

            container.innerHTML = `
                <h2 style="margin-bottom: 15px;">Dynamic System Statistics</h2>
                <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                    <div class="stat-card"><div class="val">${total}</div><div class="lbl">Total Database Fixtures</div></div>
                    <div class="stat-card"><div class="val">${((btts/total)*100).toFixed(1)}%</div><div class="lbl">BTTS Ratio</div></div>
                    <div class="stat-card"><div class="val">${((over25/total)*100).toFixed(1)}%</div><div class="lbl">Over 2.5 Goals Ratio</div></div>
                    <div class="stat-card"><div class="val">${((homeWins/total)*100).toFixed(1)}%</div><div class="lbl">Home Pick Ratio</div></div>
                    <div class="stat-card"><div class="val">${((draws/total)*100).toFixed(1)}%</div><div class="lbl">Draw Pick Ratio</div></div>
                    <div class="stat-card"><div class="val">${((awayWins/total)*100).toFixed(1)}%</div><div class="lbl">Away Pick Ratio</div></div>
                </div>
            `;
        }
    </script>
</body>
</html>
