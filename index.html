<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Analytics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div class="logo">
      ⚽ ApexAnalytics <span class="badge">LIVE API</span>
    </div>
    <nav class="nav-links">
      <button class="nav-tab active" data-view="predictions">Predictions</button>
      <button class="nav-tab" data-view="results">Results</button>
      <button class="nav-tab" data-view="league-tables">League Tables</button>
      <button class="nav-tab" data-view="team-form">Team Form</button>
    </nav>
  </header>

  <main id="main-content" class="container">
    <!-- Dynamic JS content renders here -->
  </main>

  <!-- Loaded as ES Module to support module imports -->
  <script type="module" src="script.js"></script>
</body>
</html>
